<form [formGroup]="formLogin" class="form-login" (submit)="login()">
  <h2>Login</h2>
  <div class="form-feildes">
    <p-inputgroup>
      <p-inputgroup-addon>
        <i class="pi pi-enveloper"></i>
      </p-inputgroup-addon>
      <input
        pInputText
        placeholder="Email or PhonNumber"
        formControlName="email"
      />
    </p-inputgroup>

    <p-inputgroup>
      <p-inputgroup-addon><i class="pi pi-lock"></i></p-inputgroup-addon>
      <p-password
        [toggleMask]="true"
        autocomplete="off"
        formControlName="password"
        [feedback]="false"
      />
    </p-inputgroup>
  </div>
  <div>
    <p-button label="Login " [disabled]="formLogin.invalid" type="submit" />
  </div>
</form>
<p>Don't have an account? <a routerLink="/registry">Sign up </a></p>
