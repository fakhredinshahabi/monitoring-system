<section class="header">
  <div class="logo">
    <img src="/assets/imgs/logo.png" width="75" />

    <!-- <h3>Monitoring System</h3> -->
    <div><p-button icon="pi pi-bars" (onClick)="logout()" /></div>
  </div>

  <p-inputgroup>
    <input pInputText placeholder="Keyword" />
    <p-inputgroup-addon>
      <p-button icon="pi pi-search" severity="secondary" variant="text" />
    </p-inputgroup-addon>
  </p-inputgroup>
  <div class="righ-headr">
    <div class="notif"><i class="pi pi-bell"></i></div>
    <div class="profile">
      <div class="status"></div>
      <p-button
        icon="pi pi-user"
        [rounded]="true"
        severity="info"
        (click)="showDialog()"
      />
    </div>
    <div class="them">
      <div class="card flex justify-center gap-4">
        <p-toggleswitch>
          <ng-template #handle let-checked="checked">
            <i
              [class]="['!text-xs', 'pi', checked ? 'pi-check' : 'pi-times']"
            ></i>
          </ng-template>
        </p-toggleswitch>
      </div>
    </div>
  </div>
</section>

<div class="card flex justify-center">
  <p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '25rem' }">
    <ng-template #header>
      <div class="inline-flex items-center justify-center gap-2">
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          shape="circle"
        />
        <span class="font-bold whitespace-nowrap">Amy Elsner</span>
      </div>
    </ng-template>
    <span class="text-surface-500 dark:text-surface-400 block mb-8"
      >Update your information.</span
    >
    <div class="flex items-center gap-4 mb-4">
      <label for="username" class="font-semibold w-24">Username</label>
      <input
        pInputText
        id="username"
        class="flex-auto"
        value="profileFields.email"
        readonly
        autocomplete="off"
      />
    </div>
    <div class="flex items-center gap-4 mb-2">
      <label for="email" class="font-semibold w-24">Email</label>
      <input pInputText id="email" class="flex-auto" autocomplete="off" />
    </div>
    <ng-template #footer>
      <p-button
        label="Cancel"
        [text]="true"
        severity="secondary"
        (click)="visible = false"
      />
      <p-button
        label="Save"
        [outlined]="true"
        severity="secondary"
        (click)="visible = false"
      />
    </ng-template>
  </p-dialog>
</div>
