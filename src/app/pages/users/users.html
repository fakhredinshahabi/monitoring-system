<div class="card">
  <p-table [value]="usersList" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Email</th>
        <th>ID</th>
        <th>Role</th>
        <th>Date</th>
      </tr>
    </ng-template>
    <ng-template #body let-user>
      <tr>
        <td>{{ user.email }}</td>
        <td>{{ user.id }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.createdAt }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
